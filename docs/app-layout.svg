<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Segoe UI, Arial, sans-serif">
  <title>MSX Lookout — My Stocks tab layout (mockup, drawn from the real app CSS)</title>
  <rect x="0" y="0" width="900" height="660" fill="#0a0a0a"/>
  <ellipse cx="150" cy="-20" rx="420" ry="240" fill="#217346" opacity="0.14"/>

  <!-- header -->
  <line x1="0" y1="150" x2="900" y2="150" stroke="#242422"/>
  <circle cx="56" cy="50" r="13" fill="#217346" opacity="0.25"/>
  <circle cx="56" cy="50" r="6" fill="#217346"/>
  <text x="76" y="58" font-size="24" font-weight="800" fill="#ffffff">MSX Lookout</text>

  <rect x="40" y="88" width="560" height="48" rx="24" fill="#1a1a19" stroke="#3a3a37"/>
  <text x="64" y="118" font-size="15" fill="#6f6e67">Search a stock: name, shortcut, or ticker...</text>

  <!-- nav pills -->
  <rect x="40" y="158" width="118" height="40" rx="20" fill="#ffffff"/>
  <text x="99" y="183" font-size="14.5" font-weight="600" fill="#0a0a0a" text-anchor="middle">My Stocks</text>
  <rect x="168" y="158" width="104" height="40" rx="20" fill="none" stroke="#242422"/>
  <text x="220" y="183" font-size="14.5" font-weight="600" fill="#c3c2b7" text-anchor="middle">Compare</text>
  <rect x="282" y="158" width="90" height="40" rx="20" fill="none" stroke="#242422"/>
  <text x="327" y="183" font-size="14.5" font-weight="600" fill="#c3c2b7" text-anchor="middle">Charts</text>

  <!-- action bar -->
  <rect x="40" y="214" width="110" height="44" rx="22" fill="none" stroke="#3a3a37"/>
  <text x="95" y="241" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Refresh</text>
  <rect x="162" y="214" width="170" height="44" rx="22" fill="none" stroke="#3a3a37"/>
  <text x="247" y="241" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Download Excel</text>

  <!-- table -->
  <rect x="40" y="276" width="820" height="268" rx="16" fill="#1a1a19" stroke="#242422"/>
  <rect x="40" y="276" width="820" height="38" rx="16" fill="#201f1e"/>
  <rect x="40" y="298" width="820" height="16" fill="#201f1e"/>
  <text x="60"  y="300" font-size="11" letter-spacing="0.5" fill="#898781">STOCK</text>
  <text x="466" y="300" font-size="11" letter-spacing="0.5" fill="#898781" text-anchor="end">PRICE</text>
  <text x="566" y="300" font-size="11" letter-spacing="0.5" fill="#898781" text-anchor="end">CHANGE</text>
  <text x="636" y="300" font-size="11" letter-spacing="0.5" fill="#898781" text-anchor="end">QTY</text>
  <text x="736" y="300" font-size="11" letter-spacing="0.5" fill="#898781" text-anchor="end">VALUE</text>
  <text x="846" y="300" font-size="11" letter-spacing="0.5" fill="#898781" text-anchor="end">GAIN/LOSS</text>

  <line x1="40" y1="360" x2="860" y2="360" stroke="#242422"/>
  <line x1="40" y1="406" x2="860" y2="406" stroke="#242422"/>
  <line x1="40" y1="452" x2="860" y2="452" stroke="#242422"/>
  <line x1="40" y1="498" x2="860" y2="498" stroke="#242422"/>

  <!-- row 1: BKMB -->
  <text x="60" y="342" font-size="14.5" fill="#ffffff">BKMB <tspan fill="#898781" font-size="12.5">· Bank Muscat</tspan></text>
  <text x="466" y="342" font-size="14.5" fill="#ffffff" text-anchor="end">0.399</text>
  <text x="566" y="342" font-size="14.5" fill="#0ca30c" font-weight="600" text-anchor="end">+1.02%</text>
  <text x="636" y="342" font-size="14.5" fill="#c3c2b7" text-anchor="end">1,000</text>
  <text x="736" y="342" font-size="14.5" fill="#ffffff" text-anchor="end">399.000</text>
  <text x="846" y="342" font-size="14.5" fill="#0ca30c" font-weight="600" text-anchor="end">+12.500</text>

  <!-- row 2: OFMI -->
  <text x="60" y="388" font-size="14.5" fill="#ffffff">OFMI <tspan fill="#898781" font-size="12.5">· Oman Flour Mills</tspan></text>
  <text x="466" y="388" font-size="14.5" fill="#ffffff" text-anchor="end">0.612</text>
  <text x="566" y="388" font-size="14.5" fill="#d03b3b" font-weight="600" text-anchor="end">-0.48%</text>
  <text x="636" y="388" font-size="14.5" fill="#c3c2b7" text-anchor="end">500</text>
  <text x="736" y="388" font-size="14.5" fill="#ffffff" text-anchor="end">306.000</text>
  <text x="846" y="388" font-size="14.5" fill="#d03b3b" font-weight="600" text-anchor="end">-3.200</text>

  <!-- row 3: OQBI -->
  <text x="60" y="434" font-size="14.5" fill="#ffffff">OQBI <tspan fill="#898781" font-size="12.5">· Oman Qatar Ins.</tspan></text>
  <text x="466" y="434" font-size="14.5" fill="#ffffff" text-anchor="end">0.215</text>
  <text x="566" y="434" font-size="14.5" fill="#898781" font-weight="600" text-anchor="end">0.00%</text>
  <text x="636" y="434" font-size="14.5" fill="#c3c2b7" text-anchor="end">2,000</text>
  <text x="736" y="434" font-size="14.5" fill="#ffffff" text-anchor="end">430.000</text>
  <text x="846" y="434" font-size="14.5" fill="#0ca30c" font-weight="600" text-anchor="end">+8.000</text>

  <!-- row 4: BKNZ -->
  <text x="60" y="480" font-size="14.5" fill="#ffffff">BKNZ <tspan fill="#898781" font-size="12.5">· Bank Nizwa</tspan></text>
  <text x="466" y="480" font-size="14.5" fill="#ffffff" text-anchor="end">0.118</text>
  <text x="566" y="480" font-size="14.5" fill="#d03b3b" font-weight="600" text-anchor="end">-1.67%</text>
  <text x="636" y="480" font-size="14.5" fill="#c3c2b7" text-anchor="end">3,000</text>
  <text x="736" y="480" font-size="14.5" fill="#ffffff" text-anchor="end">354.000</text>
  <text x="846" y="480" font-size="14.5" fill="#d03b3b" font-weight="600" text-anchor="end">-22.000</text>

  <!-- row 5: SGBS -->
  <text x="60" y="526" font-size="14.5" fill="#ffffff">SGBS <tspan fill="#898781" font-size="12.5">· Sohar International</tspan></text>
  <text x="466" y="526" font-size="14.5" fill="#ffffff" text-anchor="end">0.130</text>
  <text x="566" y="526" font-size="14.5" fill="#0ca30c" font-weight="600" text-anchor="end">+0.77%</text>
  <text x="636" y="526" font-size="14.5" fill="#c3c2b7" text-anchor="end">1,500</text>
  <text x="736" y="526" font-size="14.5" fill="#ffffff" text-anchor="end">195.000</text>
  <text x="846" y="526" font-size="14.5" fill="#0ca30c" font-weight="600" text-anchor="end">+4.500</text>

  <!-- totals -->
  <text x="40" y="580" font-size="11" letter-spacing="0.5" fill="#898781">TOTAL VALUE</text>
  <text x="40" y="604" font-size="20" font-weight="800" fill="#ffffff">OMR 1,684.000</text>
  <text x="280" y="580" font-size="11" letter-spacing="0.5" fill="#898781">TOTAL GAIN/LOSS</text>
  <text x="280" y="604" font-size="20" font-weight="800" fill="#d03b3b">-0.200</text>

  <text x="40" y="636" font-size="12" fill="#898781">Last synced: today at 5:04 PM · sample data for illustration only</text>
</svg>
