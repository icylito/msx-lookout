name: Release desktop app

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Tauri always base64-decodes this secret. A pasted minisign file, stripped
      # '=' padding, or extra whitespace all fail with "Invalid padding" only after
      # createUpdaterArtifacts is on (v0.1.0 never reached this).
      - name: Normalize updater signing key
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:RAW_KEY) { Write-Error 'TAURI_SIGNING_PRIVATE_KEY is empty'; exit 1 }
          $k = $env:RAW_KEY.Trim().Trim('"').Trim("'")
          if ($k.StartsWith('untrusted comment:')) {
            $k = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($k))
            Write-Host 'signing key: encoded raw minisign file'
          } else {
            $k = ($k -replace '\s','')
            $pad = (4 - ($k.Length % 4)) % 4
            if ($pad) { $k = $k + ('=' * $pad) }
            try { [void][Convert]::FromBase64String($k) }
            catch { Write-Error 'TAURI_SIGNING_PRIVATE_KEY is not valid base64'; exit 1 }
            Write-Host 'signing key: normalized base64'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$k"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "MSX Lookout v__VERSION__"
          releaseBody: "See the commit history for what changed. Auto-generated by CI."
          releaseDraft: true
          prerelease: false
