name: Release desktop app

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

jobs:
  release:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pin stable tip at audit

      # Windows copy/paste into GitHub secrets often injects CR, BOM, and
      # zero-width chars you cannot see. Log counts only — never the values.
      - name: Normalize updater signing key
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:RAW_KEY) { Write-Error 'TAURI_SIGNING_PRIVATE_KEY is empty'; exit 1 }
          if (-not $env:RAW_PW) { Write-Error 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty'; exit 1 }
          function Show-Hidden([string]$label, [string]$s) {
            $cr = ([regex]::Matches($s, "`r")).Count
            $lf = ([regex]::Matches($s, "`n")).Count
            $bom = if ($s.Length -gt 0 -and [int][char]$s[0] -eq 0xFEFF) { 1 } else { 0 }
            $zw = ([regex]::Matches($s, "[\u200B-\u200D\uFEFF\u00A0]")).Count
            Write-Host "$label chars=$($s.Length) CR=$cr LF=$lf BOM=$bom zw/nbsp=$zw"
          }
          function Clean-Text([string]$s, [bool]$keepLf) {
            if ($s.Length -gt 0 -and [int][char]$s[0] -eq 0xFEFF) { $s = $s.Substring(1) }
            $s = $s -replace "[\u200B-\u200D\uFEFF\u00A0]", ''
            $s = $s -replace "`r", ''
            if (-not $keepLf) { $s = $s -replace "`n", '' }
            return $s.Trim().Trim('"').Trim("'")
          }
          Show-Hidden 'key(raw)' $env:RAW_KEY
          Show-Hidden 'password(raw)' $env:RAW_PW
          $k = Clean-Text $env:RAW_KEY $true
          $p = Clean-Text $env:RAW_PW $false
          Show-Hidden 'key(clean)' $k
          Show-Hidden 'password(clean)' $p
          $utf8 = New-Object System.Text.UTF8Encoding $false
          if ($k.StartsWith('untrusted comment:')) {
            $b64 = [Convert]::ToBase64String($utf8.GetBytes($k))
            Write-Host 'secret: raw minisign, encoded to base64'
          } else {
            $b64 = ($k -replace '\s', '')
            $pad = (4 - ($b64.Length % 4)) % 4
            if ($pad) { $b64 = $b64 + ('=' * $pad) }
            try { $decoded = $utf8.GetString([Convert]::FromBase64String($b64)) }
            catch { Write-Error 'TAURI_SIGNING_PRIVATE_KEY is not a minisign file or base64 of one'; exit 1 }
            if (-not $decoded.StartsWith('untrusted comment:')) {
              Write-Error 'decoded key does not start with untrusted comment:'
              exit 1
            }
            Write-Host 'secret: already base64 of a minisign file'
          }
          $path = Join-Path $env:RUNNER_TEMP 'tauri-signing.b64'
          [IO.File]::WriteAllText($path, $b64, $utf8)
          Write-Host ("b64 chars=" + $b64.Length)
          $d = 'GHA_' + [guid]::NewGuid().ToString('N')
          $envLine = @(
            "TAURI_SIGNING_PRIVATE_KEY=$path"
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<$d"
            $p
            $d
          ) -join "`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $envLine + "`n", $utf8)

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "MSX Lookout v__VERSION__"
          releaseBody: "See the commit history for what changed. Auto-generated by CI."
          releaseDraft: true
          prerelease: false
