name: Release desktop app

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Tauri always base64-decodes this secret. A pasted minisign file, stripped
      # '=' padding, or extra whitespace all fail with "Invalid padding" only after
      # createUpdaterArtifacts is on (v0.1.0 never reached this).
      - name: Normalize updater signing key
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:RAW_KEY) { Write-Error 'TAURI_SIGNING_PRIVATE_KEY is empty'; exit 1 }
          if (-not $env:RAW_PW) { Write-Error 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty'; exit 1 }
          $k = $env:RAW_KEY.Trim().Trim([char]0xFEFF).Trim('"').Trim("'")
          $p = $env:RAW_PW.Trim().Trim('"').Trim("'")
          $path = Join-Path $env:RUNNER_TEMP 'tauri-signing.key'
          $utf8 = New-Object System.Text.UTF8Encoding $false
          function Write-KeyFile([string]$content) {
            $n = $content.Replace("`r`n", "`n").Replace("`r", "`n").Trim() + "`n"
            [IO.File]::WriteAllText($path, $n, $utf8)
          }
          if ($k.StartsWith('untrusted comment:')) {
            Write-KeyFile $k
            Write-Host 'key file: raw minisign'
          } else {
            $b64 = ($k -replace '\s', '')
            $pad = (4 - ($b64.Length % 4)) % 4
            if ($pad) { $b64 = $b64 + ('=' * $pad) }
            try { $bytes = [Convert]::FromBase64String($b64) }
            catch { Write-Error 'TAURI_SIGNING_PRIVATE_KEY is not a minisign file or base64 of one'; exit 1 }
            $decoded = [Text.Encoding]::UTF8.GetString($bytes)
            if (-not $decoded.StartsWith('untrusted comment:')) {
              Write-Error 'decoded key does not start with untrusted comment: — paste the full .key file into the secret'
              exit 1
            }
            Write-KeyFile $decoded
            Write-Host 'key file: base64-decoded minisign'
          }
          Write-Host ("key file bytes=" + [IO.File]::ReadAllBytes($path).Length)
          $d = 'GHA_' + [guid]::NewGuid().ToString('N')
          $envLine = @(
            "TAURI_SIGNING_PRIVATE_KEY=$path"
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<$d"
            $p
            $d
          ) -join "`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $envLine + "`n", $utf8)

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "MSX Lookout v__VERSION__"
          releaseBody: "See the commit history for what changed. Auto-generated by CI."
          releaseDraft: true
          prerelease: false
